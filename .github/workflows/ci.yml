name: CI

on:
    push:
        branches:
            - main
            # - develop
            # - testing

    pull_request:
        branches:
            - main
            # - develop
            # - testing

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: postgresql://ci:ci@localhost:5432/reliefroot_ci

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npm run prisma:generate

            - name: Lint
              run: npm run lint

            - name: Check Formatting
              run: npm run format:check

            - name: Build
              run: npm run build
